name: Agent Sprint Governor

on:
  workflow_dispatch:
    inputs:
      sprint_id:
        description: Sprint identifier
        required: false
        type: string
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-sprint-governor
  cancel-in-progress: false

jobs:
  evaluate-sprint:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve active sprint
        id: sprint
        env:
          REQUESTED_SPRINT: ${{ inputs.sprint_id || '' }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_SPRINT" ]; then
            sprint="$REQUESTED_SPRINT"
          else
            sprint="$(grep -rl '^status: active$' .agent/sprints/*/sprint.yaml | sort | head -n 1 | cut -d/ -f3 || true)"
          fi
          if [ -z "$sprint" ]; then
            echo "has_sprint=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_sprint=true" >> "$GITHUB_OUTPUT"
          echo "id=$sprint" >> "$GITHUB_OUTPUT"

      - name: Check queue and sprint state
        if: steps.sprint.outputs.has_sprint == 'true'
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/agent/sprint-lifecycle.mjs --sprint=${{ steps.sprint.outputs.id }} > sprint-state.json
          lifecycle_code=$?
          set -e
          open_agent_prs="$(gh pr list --state open --base main --json headRefName --jq '[.[] | select(.headRefName | startswith("agent/"))] | length')"
          if [ "$lifecycle_code" -eq 0 ] && [ "$open_agent_prs" -eq 0 ]; then
            echo "can_close=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_close=false" >> "$GITHUB_OUTPUT"
          fi
          cat sprint-state.json

      - name: Generate closure artifacts
        if: steps.state.outputs.can_close == 'true'
        run: node scripts/agent/sprint-lifecycle.mjs --sprint=${{ steps.sprint.outputs.id }} --close

      - name: Open sprint closure pull request
        if: steps.state.outputs.can_close == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="automation/close-${{ steps.sprint.outputs.id }}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agent/sprints/${{ steps.sprint.outputs.id }}
          git commit -m "chore(agent): close ${{ steps.sprint.outputs.id }}"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "Close ${{ steps.sprint.outputs.id }}" --body "Generates the deterministic sprint completion report, metrics and retrospective after all linked tasks completed and no agent PR remained open."
