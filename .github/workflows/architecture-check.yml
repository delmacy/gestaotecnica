name: Architecture Check
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'src/**'
      - '.github/workflows/architecture-check.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-explicit-any.ts'
      - 'scripts/validate-architecture-rules.ts'

jobs:
  validate-architecture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Architecture Validation (Strict Mode)
        run: |
          echo "Running strict architecture rules validation..."
          npm run check:architecture -- --strict
          echo "Architecture validation passed."

      - name: Reject explicit any in changed TypeScript
        run: |
          echo "Checking changed TypeScript files for explicit any..."
          npm run check:no-explicit-any
          echo "No explicit any usage found."
