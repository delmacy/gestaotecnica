name: Architecture Rules Validation
on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/validate-architecture-rules.ts"
      - ".github/workflows/architecture-check.yml"
      - "docs/ARCHITECTURE.md"

jobs:
  validate-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Strict Architecture Check
        run: npm run check:architecture -- --strict
