name: OpenCode Task Runner

on:
  workflow_dispatch:
    inputs:
      task_file:
        description: Optional file name inside .agent/tasks/ready
        required: false
        type: string
  repository_dispatch:
    types: [run-next-opencode-task]
  schedule:
    - cron: "3,18,33,48 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: opencode-production-queue
  cancel-in-progress: false

jobs:
  execute-task:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestaotecnica_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestaotecnica_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestaotecnica_ci
      PLATFORM_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestaotecnica_ci
      RUNTIME_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestaotecnica_ci
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Stop when an agent PR is already open
        id: queue_gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh pr list --state open --base main --json headRefName --jq '[.[] | select(.headRefName | startswith("agent/"))] | length')"
          if [ "$count" -gt 0 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "An agent PR is already open; queue remains serialized."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select and classify next task
        if: steps.queue_gate.outputs.run == 'true'
        id: task
        env:
          REQUESTED_TASK: ${{ inputs.task_file || '' }}
          SIMPLE_MODEL: ${{ vars.OPENCODE_MODEL_SIMPLE || secrets.OPENCODE_MODEL_SIMPLE }}
          STANDARD_MODEL: ${{ vars.OPENCODE_MODEL_STANDARD || secrets.OPENCODE_MODEL_STANDARD }}
          ADVANCED_MODEL: ${{ vars.OPENCODE_MODEL_ADVANCED || secrets.OPENCODE_MODEL_ADVANCED }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_TASK" ]; then
            task_file=".agent/tasks/ready/$REQUESTED_TASK"
          else
            task_file="$(find .agent/tasks/ready -maxdepth 1 -type f -name '*.md' -print | sort | head -n 1 || true)"
          fi
          if [ -z "${task_file:-}" ] || [ ! -f "$task_file" ]; then
            echo "has_task=false" >> "$GITHUB_OUTPUT"
            echo "No ready task found."
            exit 0
          fi

          metadata="$(node scripts/agent/read-task-metadata.mjs "$task_file")"
          task_id="$(jq -r '.id' <<<"$metadata")"
          model_tier="$(jq -r '.model_tier' <<<"$metadata")"
          risk="$(jq -r '.risk' <<<"$metadata")"
          max_files="$(jq -r '.max_files' <<<"$metadata")"

          case "$model_tier" in
            simple) model="$SIMPLE_MODEL" ;;
            standard) model="$STANDARD_MODEL" ;;
            advanced) model="$ADVANCED_MODEL" ;;
            *) echo "::error::Unsupported model tier: $model_tier"; exit 1 ;;
          esac

          if [ -z "$model" ] || [ "$model" = "null" ]; then
            echo "::error::Repository variable or secret for $model_tier model is not configured."
            exit 1
          fi
          if [ "$risk" = "high" ]; then
            echo "::error::High-risk tasks require manual execution and cannot enter the automatic queue."
            exit 1
          fi

          task_name="$(basename "$task_file")"
          branch="agent/$task_id"
          cp "$task_file" /tmp/opencode-task.md
          {
            echo "has_task=true"
            echo "file=$task_file"
            echo "name=$task_name"
            echo "id=$task_id"
            echo "branch=$branch"
            echo "model=$model"
            echo "model_tier=$model_tier"
            echo "risk=$risk"
            echo "max_files=$max_files"
            echo "content<<__TASK__"
            cat "$task_file"
            echo
            echo "__TASK__"
          } >> "$GITHUB_OUTPUT"

      - name: Create task branch
        if: steps.task.outputs.has_task == 'true'
        run: git switch -c "${{ steps.task.outputs.branch }}"

      - name: Run OpenCode implementation
        if: steps.task.outputs.has_task == 'true'
        uses: anomalyco/opencode/github@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          model: ${{ steps.task.outputs.model }}
          agent: build
          share: false
          prompt: |
            Execute exactly one compact queued task in the current working tree.

            Model tier: ${{ steps.task.outputs.model_tier }}
            Risk: ${{ steps.task.outputs.risk }}
            Maximum changed files: ${{ steps.task.outputs.max_files }}

            ${{ steps.task.outputs.content }}

            Mandatory rules:
            - Read AGENTS.md, .agent/policies/model-routing.md, and the task contract.
            - Treat allowed_paths, forbidden_paths, max_files, non-goals, and acceptance criteria as hard constraints.
            - Do not make architectural decisions not explicitly requested by the task.
            - Do not modify workflows, secrets, deployment configuration, schemas, or migrations.
            - Do not commit, push, merge, or open a pull request.
            - Run the task validation commands and leave changes in the working tree.

      - name: Enforce task size
        if: steps.task.outputs.has_task == 'true'
        run: |
          set -euo pipefail
          changed_count="$(git status --porcelain | wc -l | tr -d ' ')"
          if [ "$changed_count" -gt "${{ steps.task.outputs.max_files }}" ]; then
            echo "::error::Task changed $changed_count files; maximum is ${{ steps.task.outputs.max_files }}."
            exit 1
          fi

      - name: Validate implementation
        if: steps.task.outputs.has_task == 'true'
        id: validation
        continue-on-error: true
        run: |
          set -o pipefail
          {
            git diff --check
            npm run lint
            npm run typecheck
            npm run check:architecture
            npm run test:unit
            npm run test:integration
            npm run build
          } 2>&1 | tee validation.log

      - name: Repair validation failures
        if: steps.task.outputs.has_task == 'true' && steps.validation.outcome == 'failure'
        uses: anomalyco/opencode/github@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          model: ${{ steps.task.outputs.model }}
          agent: build
          share: false
          prompt: |
            Repair the current compact task only.
            Read validation.log and fix failures caused by the current changes.
            Keep the same allowed paths and maximum of ${{ steps.task.outputs.max_files }} changed files.
            Do not broaden scope, disable tests, modify workflows, commit, push, merge, or open a pull request.

      - name: Final validation and size gate
        if: steps.task.outputs.has_task == 'true'
        run: |
          set -euo pipefail
          changed_count="$(git status --porcelain | wc -l | tr -d ' ')"
          test "$changed_count" -le "${{ steps.task.outputs.max_files }}"
          git diff --check
          npm run lint
          npm run typecheck
          npm run check:architecture
          npm run test:unit
          npm run test:integration
          npm run build

      - name: Mark task completed in proposed change
        if: steps.task.outputs.has_task == 'true'
        run: |
          mkdir -p .agent/tasks/completed
          git mv "${{ steps.task.outputs.file }}" ".agent/tasks/completed/${{ steps.task.outputs.name }}"

      - name: Commit and push task branch
        if: steps.task.outputs.has_task == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "::error::OpenCode produced no committable changes."
            exit 1
          fi
          git commit -m "feat(${{ steps.task.outputs.id }}): implement compact task"
          git push --set-upstream origin "${{ steps.task.outputs.branch }}"

      - name: Open pull request and enable auto-merge
        if: steps.task.outputs.has_task == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr_url="$(gh pr create --base main --head "${{ steps.task.outputs.branch }}" --title "${{ steps.task.outputs.id }}: automated compact task" --body-file /tmp/opencode-task.md)"
          gh pr merge "$pr_url" --auto --squash --delete-branch
