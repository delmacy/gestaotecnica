name: OpenCode Task Runner

on:
  workflow_dispatch:
    inputs:
      task_file:
        description: Optional file name inside .agent/tasks/ready
        required: false
        type: string
      model_tier:
        description: Override model tier for this run
        required: false
        default: simple
        type: choice
        options:
          - simple
          - standard
          - advanced
      diagnostic_only:
        description: Validate configuration without invoking the model
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [run-next-opencode-task]
  schedule:
    - cron: "3,18,33,48 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

concurrency:
  group: opencode-production-queue
  cancel-in-progress: false

jobs:
  execute-task:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestaotecnica_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestaotecnica_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestaotecnica_ci
      PLATFORM_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestaotecnica_ci
      RUNTIME_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestaotecnica_ci
      AGENT_WORK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestaotecnica_ci
      JWT_SECRET: github-actions-test-secret-not-for-production
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Validate OpenCode configuration
        id: config-check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENCODE_MODEL_SIMPLE: ${{ vars.OPENCODE_MODEL_SIMPLE || secrets.OPENCODE_MODEL_SIMPLE }}
          OPENCODE_MODEL_STANDARD: ${{ vars.OPENCODE_MODEL_STANDARD || secrets.OPENCODE_MODEL_STANDARD }}
          OPENCODE_MODEL_ADVANCED: ${{ vars.OPENCODE_MODEL_ADVANCED || secrets.OPENCODE_MODEL_ADVANCED }}
        run: |
          set -euo pipefail

          has_key=false
          for var in OPENROUTER_API_KEY OPENAI_API_KEY ANTHROPIC_API_KEY GOOGLE_API_KEY; do
            if [ -n "${!var:-}" ]; then
              has_key=true
              break
            fi
          done

          if [ "$has_key" = "false" ]; then
            echo "::error::No provider API key is configured. Set at least one of: OPENROUTER_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLE_API_KEY."
            exit 1
          fi

          has_model=false
          for var in OPENCODE_MODEL_SIMPLE OPENCODE_MODEL_STANDARD OPENCODE_MODEL_ADVANCED; do
            if [ -n "${!var:-}" ]; then
              has_model=true
              break
            fi
          done

          if [ "$has_model" = "false" ]; then
            echo "::error::No OpenCode model is configured. Set at least one of: OPENCODE_MODEL_SIMPLE, OPENCODE_MODEL_STANDARD, OPENCODE_MODEL_ADVANCED."
            exit 1
          fi

          echo "Provider API key: configured"
          echo "OpenCode models: at least one configured"
          echo "has_config=true" >> "$GITHUB_OUTPUT"

      - name: Serialize queue by open PR
        id: queue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count="$(gh pr list --state open --base main --json headRefName --jq '[.[] | select(.headRefName | startswith("agent/"))] | length')"
          test "$count" -eq 0 && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"

      - name: Select task and model
        if: steps.queue.outputs.run == 'true'
        id: task
        env:
          REQUESTED_TASK: ${{ inputs.task_file || '' }}
          SIMPLE_MODEL: ${{ vars.OPENCODE_MODEL_SIMPLE || secrets.OPENCODE_MODEL_SIMPLE }}
          STANDARD_MODEL: ${{ vars.OPENCODE_MODEL_STANDARD || secrets.OPENCODE_MODEL_STANDARD }}
          ADVANCED_MODEL: ${{ vars.OPENCODE_MODEL_ADVANCED || secrets.OPENCODE_MODEL_ADVANCED }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_TASK" ]; then
            task_file=".agent/tasks/ready/$REQUESTED_TASK"
          else
            task_file="$(find .agent/tasks/ready -maxdepth 1 -type f -name '*.md' -print | sort | head -n 1 || true)"
          fi
          if [ -z "${task_file:-}" ] || [ ! -f "$task_file" ]; then
            echo "has_task=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          metadata="$(node scripts/agent/read-task-metadata.mjs "$task_file")"
          task_id="$(jq -r '.id' <<<"$metadata")"
          tier="$(jq -r '.model_tier' <<<"$metadata")"
          risk="$(jq -r '.risk' <<<"$metadata")"
          max_files="$(jq -r '.max_files' <<<"$metadata")"
          case "$tier" in
            simple) model="$SIMPLE_MODEL" ;;
            standard) model="$STANDARD_MODEL" ;;
            advanced) model="$ADVANCED_MODEL" ;;
            *) exit 1 ;;
          esac
          test -n "$model" || { echo "::error::Missing model for tier $tier"; exit 1; }
          test "$risk" != "high" || { echo "::error::High-risk tasks require manual execution"; exit 1; }
          cp "$task_file" /tmp/opencode-task.md
          {
            echo "has_task=true"
            echo "file=$task_file"
            echo "name=$(basename "$task_file")"
            echo "id=$task_id"
            echo "branch=agent/$task_id"
            echo "tier=$tier"
            echo "risk=$risk"
            echo "model=$model"
            echo "max_files=$max_files"
            echo "content<<__TASK__"
            cat "$task_file"
            echo
            echo "__TASK__"
          } >> "$GITHUB_OUTPUT"

      - name: Create task branch
        if: steps.task.outputs.has_task == 'true'
        run: git switch -c "${{ steps.task.outputs.branch }}"

      - name: Run OpenCode
        if: steps.task.outputs.has_task == 'true' && inputs.diagnostic_only != true
        uses: anomalyco/opencode/github@github-v1.2.25
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPEN_CODE_API: ${{ secrets.OPEN_CODE_API }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          model: ${{ steps.task.outputs.model }}
          agent: build
          share: false
          use_github_token: true
          prompt: |
            Execute exactly one compact task.
            Tier: ${{ steps.task.outputs.tier }}
            Risk: ${{ steps.task.outputs.risk }}
            Maximum implementation files: ${{ steps.task.outputs.max_files }}

            ${{ steps.task.outputs.content }}

            Read AGENTS.md and .agent/policies/model-routing.md. Treat allowed_paths, forbidden_paths, acceptance criteria and non-goals as hard constraints. Do not commit, push, merge, open a PR, modify workflows, schemas, migrations, deployment or secrets.

      - name: Diagnostic summary
        if: steps.task.outputs.has_task == 'true' && inputs.diagnostic_only == true
        env:
          OPENCODE_MODEL_SIMPLE: ${{ vars.OPENCODE_MODEL_SIMPLE || secrets.OPENCODE_MODEL_SIMPLE }}
          OPENCODE_MODEL_STANDARD: ${{ vars.OPENCODE_MODEL_STANDARD || secrets.OPENCODE_MODEL_STANDARD }}
          OPENCODE_MODEL_ADVANCED: ${{ vars.OPENCODE_MODEL_ADVANCED || secrets.OPENCODE_MODEL_ADVANCED }}
        run: |
          set -euo pipefail
          echo "=== OpenCode Configuration Diagnostic ==="
          echo "Tier from task: ${{ steps.task.outputs.tier }}"
          echo "Model resolved: ${{ steps.task.outputs.model }}"
          echo "Risk: ${{ steps.task.outputs.risk }}"
          echo ""
          echo "Model variables:"
          echo "  OPENCODE_MODEL_SIMPLE: $([ -n '$OPENCODE_MODEL_SIMPLE' ] && echo 'configured' || echo 'NOT SET' )"
          echo "  OPENCODE_MODEL_STANDARD: $([ -n '$OPENCODE_MODEL_STANDARD' ] && echo 'configured' || echo 'NOT SET' )"
          echo "  OPENCODE_MODEL_ADVANCED: $([ -n '$OPENCODE_MODEL_ADVANCED' ] && echo 'configured' || echo 'NOT SET' )"
          echo ""
          echo "Diagnostic only mode - model was NOT invoked."

      - name: Enforce scope and size
        if: steps.task.outputs.has_task == 'true' && inputs.diagnostic_only != true
        run: |
          set -euo pipefail
          node scripts/agent/validate-task-scope.mjs origin/main "${{ steps.task.outputs.id }}"
          changed_count="$(git status --porcelain | wc -l | tr -d ' ')"
          test "$changed_count" -le "${{ steps.task.outputs.max_files }}"

      - name: Validate implementation
        if: steps.task.outputs.has_task == 'true' && inputs.diagnostic_only != true
        id: validation
        continue-on-error: true
        run: |
          set -o pipefail
          { git diff --check; npm run lint; npm run typecheck; npm run check:architecture -- --strict; npm run check:no-explicit-any; npm run db:bootstrap; npm run db:validate; npm run test:unit; npm run test:integration; npm run build; } 2>&1 | tee validation.log

      - name: Repair once
        if: steps.task.outputs.has_task == 'true' && inputs.diagnostic_only != true && steps.validation.outcome == 'failure'
        uses: anomalyco/opencode/github@github-v1.2.25
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPEN_CODE_API: ${{ secrets.OPEN_CODE_API }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        with:
          model: ${{ steps.task.outputs.model }}
          agent: build
          share: false
          prompt: Read validation.log and repair only failures caused by the current task. Preserve allowed paths and file limit. Do not disable tests or broaden scope.

      - name: Final validation
        if: steps.task.outputs.has_task == 'true' && inputs.diagnostic_only != true
        run: |
          set -euo pipefail
          node scripts/agent/validate-task-scope.mjs origin/main "${{ steps.task.outputs.id }}"
          test "$(git status --porcelain | wc -l | tr -d ' ')" -le "${{ steps.task.outputs.max_files }}"
          git diff --check
          npm run lint
          npm run typecheck
          npm run check:architecture -- --strict
          npm run check:no-explicit-any
          npm run db:bootstrap
          npm run db:validate
          npm run test:unit
          npm run test:integration
          npm run build

      - name: Complete task and push
        if: steps.task.outputs.has_task == 'true' && inputs.diagnostic_only != true
        run: |
          set -euo pipefail
          mkdir -p .agent/tasks/completed
          git mv "${{ steps.task.outputs.file }}" ".agent/tasks/completed/${{ steps.task.outputs.name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(${{ steps.task.outputs.id }}): implement compact task"
          git push --set-upstream origin "${{ steps.task.outputs.branch }}"

      - name: Open pull request
        if: steps.task.outputs.has_task == 'true' && inputs.diagnostic_only != true
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_url="$(gh pr create --base main --head "${{ steps.task.outputs.branch }}" --title "${{ steps.task.outputs.id }}: automated compact task" --body-file /tmp/opencode-task.md)"
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge for simple low-risk task
        if: steps.task.outputs.has_task == 'true' && inputs.diagnostic_only != true && steps.task.outputs.tier == 'simple' && steps.task.outputs.risk == 'low'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.pr.outputs.url }}" --auto --squash --delete-branch

      - name: Require review for escalated task
        if: steps.task.outputs.has_task == 'true' && inputs.diagnostic_only != true && (steps.task.outputs.tier != 'simple' || steps.task.outputs.risk != 'low')
        run: echo "PR opened without auto-merge; human approval is required."
