name: Phase 2 Environment Validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'drizzle.config.ts'
      - '.github/workflows/phase-2-env-validation.yml'

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tec_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://root:password@localhost:5432/tec_db
      PLATFORM_DATABASE_URL: postgres://root:password@localhost:5432/tec_db
      RUNTIME_DATABASE_URL: postgres://root:password@localhost:5432/tec_db
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Resolve Playwright version
        id: playwright-version
        shell: bash
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test']?.version || require('./package-lock.json').packages['node_modules/playwright']?.version || 'unknown'")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Database Bootstrap
        run: npm run db:bootstrap

      - name: Database Validate Migrations
        run: npm run db:validate

      - name: Architecture Check
        run: npm run check:architecture

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build
