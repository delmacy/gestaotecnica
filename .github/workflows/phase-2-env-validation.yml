name: Playwright E2E Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/e2e/**'
      - 'src/app/**'
      - 'src/components/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/phase-2-env-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestaotecnica_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestaotecnica_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestaotecnica_e2e
      PLATFORM_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestaotecnica_e2e
      RUNTIME_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestaotecnica_e2e
      JWT_SECRET: github-actions-e2e-secret-not-for-production
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p \"require('./package-lock.json').packages['node_modules/@playwright/test']?.version || 'unknown'\")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Bootstrap database
        run: npm run db:bootstrap
      - name: Build application
        run: npm run build
      - name: Start application
        run: |
          npm run start > /tmp/gestaotecnica-next.log 2>&1 &
          echo $! > /tmp/gestaotecnica-next.pid
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:3000 >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/gestaotecnica-next.log
          exit 1
      - name: Run Playwright
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
