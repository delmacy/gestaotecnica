name: Phase 2 Environment Validation

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'drizzle.config.ts'
      - '.github/workflows/phase-2-env-validation.yml'

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tec_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://root:password@localhost:5432/tec_db
      PLATFORM_DATABASE_URL: postgres://root:password@localhost:5432/tec_db
      RUNTIME_DATABASE_URL: postgres://root:password@localhost:5432/tec_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Database Bootstrap
        run: npm run db:bootstrap

      - name: Database Validate Migrations
        run: npm run db:validate

      - name: Architecture Check
        run: npm run check:architecture

      - name: Type Check
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build
