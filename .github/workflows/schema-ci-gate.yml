name: Schema CI Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'drizzle/**'
      - 'drizzle-agent-work/**'
      - 'src/db/**/schema/**'
      - 'src/scripts/db/**'
      - 'package.json'
      - 'package-lock.json'
      - 'drizzle.config.ts'
      - '.github/workflows/schema-ci-gate.yml'

permissions:
  contents: read

concurrency:
  group: schema-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestaotecnica_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gestaotecnica_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestaotecnica_ci
      PLATFORM_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestaotecnica_ci
      RUNTIME_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestaotecnica_ci
      AGENT_WORK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestaotecnica_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Bootstrap schemas
        run: npm run db:bootstrap
      - name: Apply migrations
        run: npm run db:migrate-ci
      - name: Verify schema
        run: npm run db:verify-ci
      - name: Validate migration ownership
        run: npm run db:validate
