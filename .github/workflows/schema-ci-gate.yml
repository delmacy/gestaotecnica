name: Schema CI Gate
on:
  pull_request:
    paths:
      - 'src/scripts/db/verify-schema-ci.ts'
      - 'src/scripts/db/apply-migrations-ci.ts'
      - '.github/workflows/schema-ci-gate.yml'

jobs:
  schema-ci-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap Schemas
        run: npm run db:bootstrap

      - name: Apply Migrations (Non-interactive)
        run: npm run db:apply-migrations-ci

      - name: Verify Schema CI Gate
        run: npm run db:verify-ci
