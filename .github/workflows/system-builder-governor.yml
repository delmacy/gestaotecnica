name: System Builder Governor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Governor mode to run"
        required: true
        default: "heartbeat"
        type: choice
        options:
          - heartbeat
          - tick
          - dry-run
  schedule:
    - cron: "*/20 * * * *"
  workflow_run:
    workflows:
      - "Phase 2 Environment Validation"
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: read

concurrency:
  group: system-builder-governor
  cancel-in-progress: false

jobs:
  governor:
    name: Run governor heartbeat
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    env:
      GOVERNOR_MODE: ${{ github.event.inputs.mode || 'heartbeat' }}
      GOVERNOR_HOST: ${{ secrets.OPENCODE_GOVERNOR_HOST }}
      GOVERNOR_USER: ${{ secrets.OPENCODE_GOVERNOR_USER }}
      GOVERNOR_PASSWORD: ${{ secrets.OPENCODE_GOVERNOR_PASSWORD }}
      GOVERNOR_PORT: ${{ secrets.OPENCODE_GOVERNOR_PORT || '22' }}
      GOVERNOR_GITHUB_TOKEN: ${{ secrets.OPENCODE_GOVERNOR_GITHUB_TOKEN || github.token }}
      GOVERNOR_JULES_API_KEY: ${{ secrets.OPENCODE_GOVERNOR_JULES_API_KEY }}
      GOVERNOR_ROOT: "/opt/delmacy/system-builder-orchestrator"
      GOVERNOR_CONTAINER: "opencode-supervisor"
    steps:
      - name: Validate governor secrets
        run: |
          missing=0
          for name in GOVERNOR_HOST GOVERNOR_USER GOVERNOR_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for the GitHub-hosted governor heartbeat."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install SSH password client
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Run remote governor
        env:
          SSHPASS: ${{ env.GOVERNOR_PASSWORD }}
        run: |
          set -euo pipefail

          sshpass -e ssh \
            -p "$GOVERNOR_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            "$GOVERNOR_USER@$GOVERNOR_HOST" \
            "GITHUB_TOKEN='$GOVERNOR_GITHUB_TOKEN' JULES_API_KEY='$GOVERNOR_JULES_API_KEY' GOVERNOR_MODE='$GOVERNOR_MODE' GOVERNOR_ROOT='$GOVERNOR_ROOT' GOVERNOR_CONTAINER='$GOVERNOR_CONTAINER' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$GOVERNOR_ROOT"

          if ! docker ps --format '{{.Names}}' | grep -Fxq "$GOVERNOR_CONTAINER"; then
            echo "::error::Container $GOVERNOR_CONTAINER is not running."
            exit 1
          fi

          if [ -f state/heartbeat.lock ]; then
            lock_age="$(python3 - <<'PY'
          import os, time
          print(int(time.time() - os.path.getmtime("state/heartbeat.lock")))
          PY
          )"
            if [ "$lock_age" -lt 900 ]; then
              echo "Recent heartbeat lock is active (${lock_age}s); skipping to avoid duplicate Jules sessions."
              exit 0
            fi
          fi

          run_in_governor_container() {
            docker exec \
              -e GITHUB_TOKEN="$GITHUB_TOKEN" \
              -e GITHUB_APPROVER_TOKEN="$GITHUB_TOKEN" \
              -e JULES_API_KEY="$JULES_API_KEY" \
              -e REQUIRE_MERGE_BEFORE_NEXT=true \
              -e AUTO_APPROVE_WITH_BOT=true \
              -e AUTO_MERGE=true \
              "$GOVERNOR_CONTAINER" \
              "$@"
          }

          active_task_count() {
            python3 - <<'PY'
          import json
          from pathlib import Path

          active_statuses = {
              "ready",
              "jules_running",
              "pr_open",
              "opencode_reviewing",
              "approved_waiting_merge",
              "changes_requested",
              "review_failed",
              "needs_codex",
              "failed",
          }
          state = json.loads(Path("state/state.json").read_text())
          active = state.get("sprintPlan", {}).get("activeSprint")
          sprint = active.get("id") if isinstance(active, dict) else active
          count = 0
          for task in state.get("tasks", {}).values():
              if task.get("sprint") == sprint and task.get("status") in active_statuses:
                  count += 1
          print(count)
          PY
          }

          ready_task_count() {
            python3 - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("state/state.json").read_text())
          active = state.get("sprintPlan", {}).get("activeSprint")
          sprint = active.get("id") if isinstance(active, dict) else active
          print(sum(1 for task in state.get("tasks", {}).values() if task.get("sprint") == sprint and task.get("status") == "ready"))
          PY
          }

          maybe_start_single_ready_task() {
            active_count="$(active_task_count)"
            ready_count="$(ready_task_count)"

            if [ "$active_count" -eq 0 ]; then
              echo "No active task was released by governor tick."
              return 0
            fi

            if [ "$active_count" -eq 1 ] && [ "$ready_count" -eq 1 ]; then
              run_in_governor_container python3 scripts/supervisor.py flow-heartbeat
              return 0
            fi

            echo "::warning::Governor found $active_count active task(s) after tick ($ready_count ready). Skipping session creation to preserve serial execution."
          }

          case "$GOVERNOR_MODE" in
            dry-run)
              run_in_governor_container python3 scripts/opencode_governor.py tick --dry-run
              ;;
            tick)
              if [ "$(active_task_count)" -gt 0 ]; then
                echo "Active task already exists before tick; skipping governor release to avoid duplicate Jules sessions."
                exit 0
              fi
              run_in_governor_container python3 scripts/opencode_governor.py tick
              maybe_start_single_ready_task
              ;;
            heartbeat)
              run_in_governor_container python3 scripts/supervisor.py flow-heartbeat
              if [ "$(active_task_count)" -gt 0 ]; then
                echo "Active task exists after refresh; skipping governor release/session creation."
                exit 0
              fi
              run_in_governor_container python3 scripts/opencode_governor.py tick
              maybe_start_single_ready_task
              ;;
            *)
              echo "::error::Unsupported GOVERNOR_MODE=$GOVERNOR_MODE"
              exit 1
              ;;
          esac
          REMOTE
