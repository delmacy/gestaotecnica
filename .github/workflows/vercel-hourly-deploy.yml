name: Vercel hourly preview promote

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Deploy even if the latest successful run used the same commit"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  actions: read
  contents: read

concurrency:
  group: vercel-hourly-preview-promote
  cancel-in-progress: false

jobs:
  deploy:
    name: Build preview candidate and promote latest main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: team_KpojeVYSgUJpZi9pUZIeCiya
      VERCEL_PROJECT_ID: prj_LIkgEIpTfmDf5Pzor9pjnValohsu
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PLATFORM_DATABASE_URL: ${{ secrets.PLATFORM_DATABASE_URL }}
      RUNTIME_DATABASE_URL: ${{ secrets.RUNTIME_DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Decide whether this commit needs deployment
        id: deploy_gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_DEPLOY: ${{ inputs.force_deploy || 'false' }}
          WORKFLOW_FILE: vercel-hourly-deploy.yml
        run: |
          set -euo pipefail

          if [ "$FORCE_DEPLOY" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual force_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?branch=main&status=success&per_page=10" \
            --jq ".workflow_runs[] | select(.id != $GITHUB_RUN_ID) | .head_sha" | head -n 1 || true)"

          if [ -n "$previous_sha" ] && [ "$previous_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=main commit already deployed by this workflow" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "reason=new main commit or no prior successful deploy found" >> "$GITHUB_OUTPUT"

      - name: Show skip reason
        if: steps.deploy_gate.outputs.deploy != 'true'
        run: echo "${{ steps.deploy_gate.outputs.reason }}"

      - name: Validate Vercel token
        if: steps.deploy_gate.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "Missing GitHub secret VERCEL_TOKEN."
            exit 1
          fi

      - name: Setup Node.js
        if: steps.deploy_gate.outputs.deploy == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        if: steps.deploy_gate.outputs.deploy == 'true'
        run: npm ci

      - name: Install Vercel CLI
        if: steps.deploy_gate.outputs.deploy == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel production project settings
        if: steps.deploy_gate.outputs.deploy == 'true'
        run: vercel pull --environment=production --yes --token="$VERCEL_TOKEN"

      - name: Export production environment for local build
        if: steps.deploy_gate.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const dotenv = require("dotenv");

          const envFile = ".env.production.local";
          const requiredKeys = [
            "DATABASE_URL",
            "PLATFORM_DATABASE_URL",
            "RUNTIME_DATABASE_URL",
            "JWT_SECRET",
          ];

          const parsed = fs.existsSync(envFile)
            ? dotenv.parse(fs.readFileSync(envFile))
            : {};
          const resolved = Object.fromEntries(
            requiredKeys.map((key) => [key, parsed[key] || process.env[key] || ""]),
          );
          const missing = requiredKeys.filter((key) => !resolved[key]);
          if (missing.length > 0) {
            throw new Error(`Missing required production env key(s): ${missing.join(", ")}`);
          }

          const githubEnv = process.env.GITHUB_ENV;
          if (!githubEnv) {
            throw new Error("GITHUB_ENV is not available.");
          }

          const output = requiredKeys
            .map((key) => `${key}<<__${key}__\n${resolved[key]}\n__${key}__`)
            .join("\n");

          fs.appendFileSync(githubEnv, `${output}\n`);
          console.log(`Exported ${requiredKeys.length} production env key(s) for build.`);
          NODE

      - name: Validate Next.js build
        if: steps.deploy_gate.outputs.deploy == 'true'
        run: npm run build

      - name: Build Vercel preview artifact
        if: steps.deploy_gate.outputs.deploy == 'true'
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact as preview candidate
        id: preview_deploy
        if: steps.deploy_gate.outputs.deploy == 'true'
        run: |
          set -euo pipefail

          deploy_log="$(mktemp)"
          set +e
          vercel deploy --prebuilt --token="$VERCEL_TOKEN" >"$deploy_log" 2>&1
          deploy_status=$?
          set -e

          cat "$deploy_log"

          if [ "$deploy_status" -eq 0 ]; then
            preview_url="$(awk '/https:\\/\\// { url=$NF } END { print url }' "$deploy_log")"
            if [ -z "$preview_url" ]; then
              echo "::error::Vercel preview deploy succeeded but no deployment URL was found."
              exit 1
            fi
            echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
            {
              echo "### Vercel preview candidate"
              echo
              echo "- Preview: $preview_url"
              echo "- Commit: $GITHUB_SHA"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if grep -Eiq "(rate[- ]?limit|too many requests|http 429|\\b429\\b|deployment limit|deployments limit|exceeded.*deploy|limit.*deploy)" "$deploy_log"; then
            echo "::warning::Vercel preview deploy skipped because Vercel returned a deployment/rate limit. Build validation passed, so this workflow remains successful."
            {
              echo "### Vercel deploy skipped"
              echo
              echo "The production build passed, but Vercel refused the preview candidate deployment because of a deployment/rate limit."
              echo "This is treated as a soft deploy skip so CI can remain green."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          exit "$deploy_status"

      - name: Promote preview candidate to production
        if: steps.deploy_gate.outputs.deploy == 'true' && steps.preview_deploy.outputs.preview_url != ''
        run: |
          set -euo pipefail

          promote_log="$(mktemp)"
          set +e
          vercel promote "${{ steps.preview_deploy.outputs.preview_url }}" --yes --token="$VERCEL_TOKEN" >"$promote_log" 2>&1
          promote_status=$?
          set -e

          cat "$promote_log"

          if [ "$promote_status" -eq 0 ]; then
            {
              echo
              echo "### Vercel production promotion"
              echo
              echo "- Promoted: ${{ steps.preview_deploy.outputs.preview_url }}"
              echo "- Commit: $GITHUB_SHA"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if grep -Eiq "(rate[- ]?limit|too many requests|http 429|\\b429\\b|deployment limit|deployments limit|exceeded.*deploy|limit.*deploy)" "$promote_log"; then
            echo "::warning::Vercel promote skipped because Vercel returned a deployment/rate limit. Preview candidate is available."
            {
              echo
              echo "### Vercel promote skipped"
              echo
              echo "Preview candidate exists, but Vercel refused production promotion because of a deployment/rate limit."
              echo "Preview: ${{ steps.preview_deploy.outputs.preview_url }}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          exit "$promote_status"
