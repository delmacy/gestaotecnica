name: Reusable Security Scan

on:
  workflow_call:
    inputs:
      scan_containers:
        type: boolean
        default: false

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Vulnerability Audit
        run: |
          echo "Running npm/yarn audit or snyk..."
          # npm audit --audit-level=high

  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for Exposed Secrets and Credentials
        run: |
          echo "Running gitleaks/trufflehog..."
          # Prohibit forbidden patterns
          grep -rE "(.env|PRIVATE KEY|BEGIN RSA|api_key|password)" . --exclude-dir=.git && (echo "Forbidden patterns found!" && exit 1) || echo "Clean"

  workflow-permissions-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit Workflow Permissions
        run: |
          echo "Verifying that workflows use minimum required permissions..."

  container-scan:
    if: ${{ inputs.scan_containers }}
    runs-on: ubuntu-latest
    steps:
      - name: Container Image Scan
        run: echo "Running Trivy or Grype on container images..."

  forbidden-file-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbidden File Scan
        run: |
          echo "Searching for prohibited files (.env, credentials, etc.)..."
          find . -name ".env" -o -name "*.pem" -o -name "credentials.json" | grep . && exit 1 || echo "No forbidden files found"

  token-exposure-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Token Exposure Scan
        run: |
          echo "Scanning code and logs for token-like strings..."
